<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boundary Glyph Sheet</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050917;
            --bg-alt: #030511;
            --panel: rgba(8, 12, 24, 0.88);
            --panel-border: rgba(255, 255, 255, 0.08);
            --fg: #f5fbff;
            --muted: rgba(227, 235, 255, 0.65);
            --accent: #7cb7ff;
            --accent-2: #a087ff;
            --warn: #facc15;
            --danger: #f87171;
            --success: #5eead4;
            --grid-glow: hsla(210, 100%, 70%, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at 15% 20%, rgba(111, 155, 255, 0.32), transparent 45%),
                radial-gradient(circle at 80% -10%, rgba(143, 92, 255, 0.28), transparent 55%),
                linear-gradient(120deg, var(--bg), var(--bg-alt));
            color: var(--fg);
            padding: 32px 20px 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.08), transparent 55%);
            pointer-events: none;
            mix-blend-mode: screen;
            animation: drift 20s linear infinite;
        }

        .app {
            width: min(1100px, 100%);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @keyframes drift {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0);
            }
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: baseline;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.35rem, 2vw, 1.8rem);
            letter-spacing: 0.04em;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }

        .panel-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .status-pill {
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .status-pill.ok {
            color: #5eead4;
        }

        .status-pill.warn {
            color: var(--warn);
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-weight: 600;
            letter-spacing: 0.04em;
            background: linear-gradient(120deg, #7cb7ff, #a087ff);
            color: #050917;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(124, 183, 255, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(124, 183, 255, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .glow-bar {
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.1), transparent 50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .panel:hover .glow-bar {
            opacity: 1;
        }

        .meta-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .meta-chip {
            padding: 10px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            min-width: 120px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .meta-chip:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .meta-chip .label {
            font-size: 0.65rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .meta-chip .value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .trend-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .trend-wrapper canvas {
            width: 100%;
            height: 70px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .trend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .horizon-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .horizon-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .horizon-meta-item {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            gap: 6px;
        }

        .horizon-meta-item .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: rgba(233, 240, 255, 0.6);
        }

        .horizon-meta-item .value {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .horizon-sheet-wrapper {
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(4, 6, 14, 0.82);
            position: relative;
        }

        .horizon-sheet-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 20% 30%, var(--grid-glow), transparent 60%);
            pointer-events: none;
            opacity: 0.6;
        }

        .horizon-sheet-grid {
            --horizon-cols: 20;
            display: grid;
            grid-template-columns: repeat(var(--horizon-cols), minmax(16px, 1fr));
            gap: 4px;
            width: 100%;
        }

        .horizon-sheet-grid:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .horizon-cell {
            min-height: 20px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Space Mono", "JetBrains Mono", monospace;
            font-size: 0.8rem;
            color: #0a0f1c;
            transition: transform 0.2s ease, box-shadow 0.35s ease, background 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .horizon-cell:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .horizon-cell::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.25), transparent 60%);
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .horizon-cell:hover::after {
            opacity: 0.7;
        }

        .horizon-cell.glyph-pulse {
            animation: glyphPulse 1s ease;
        }

        @keyframes glyphPulse {
            0% {
                box-shadow: 0 0 0 rgba(255, 255, 255, 0.0);
            }

            50% {
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.15);
            }

            100% {
                box-shadow: 0 0 0 rgba(255, 255, 255, 0.0);
            }
        }

        .horizon-cell-hot {
            color: #080b14;
            font-weight: 600;
        }

        .horizon-cell-empty {
            background: rgba(255, 255, 255, 0.03) !important;
            border-color: rgba(255, 255, 255, 0.06) !important;
            color: rgba(233, 240, 255, 0.25);
        }

        .horizon-sheet-empty {
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
        }

        .footer-note {
            font-size: 0.85rem;
            color: var(--muted);
            text-align: right;
        }

        @media (max-width: 640px) {
            .panel {
                padding: 18px;
            }

            .horizon-sheet-wrapper {
                padding: 16px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div>
                <h1>Event Horizon Glyph Sheet</h1>
                <p>Live boundary glyph weights from the E8 Mind Observatory</p>
            </div>
            <div class="timestamp" id="updatedAt"></div>
        </header>

        <section class="panel horizon-panel">
            <div class="glow-bar"></div>
            <div class="panel-header">
                <span class="status-pill" id="statusPill">
                    <span class="status-dot"></span>
                    <span id="statusText">Waiting for data…</span>
                </span>
                <button id="refreshBtn">Refresh Now</button>
            </div>
            <div class="meta-strip">
                <div class="meta-chip">
                    <span class="label">Phase</span>
                    <span class="value" id="phaseChip">—</span>
                </div>
                <div class="meta-chip">
                    <span class="label">q_t</span>
                    <span class="value" id="qtValue">0.000</span>
                </div>
                <div class="meta-chip">
                    <span class="label">sQ</span>
                    <span class="value" id="sqValue">0.000</span>
                </div>
            </div>
            <div class="trend-wrapper">
                <div class="trend-labels">
                    <span id="trendLabel">q_t / sQ trend</span>
                    <span id="trendHint">0 samples</span>
                </div>
                <canvas id="trendCanvas"></canvas>
            </div>
            <div class="horizon-meta" id="horizonMeta">
                <div class="horizon-meta-item">
                    <span class="label">Status</span>
                    <span class="value">Awaiting telemetry…</span>
                </div>
            </div>
            <div class="horizon-sheet-wrapper">
                <div id="horizonSheetEmpty" class="horizon-sheet-empty">Awaiting boundary glyph…</div>
                <div id="horizonSheet" class="horizon-sheet-grid" aria-live="polite"></div>
            </div>
        </section>

        <p class="footer-note">Append <code>?api=http://host:port</code> or <code>?mock=1</code> to override the data
            source.</p>
    </div>

    <script>
        (() => {
            const params = new URLSearchParams(location.search);
            const API_BASE_URL = params.get('api') || (location.origin.startsWith('http') ? location.origin : 'http://localhost:7871');
            const API = {
                horizonLatest: `${API_BASE_URL}/api/horizon/latest`,
                horizonHistory: `${API_BASE_URL}/api/horizon/history`,
                bhPanel: `${API_BASE_URL}/api/bh/panel`
            };
            const MOCK_ENABLED = params.get('mock') === '1';
            const REFRESH_INTERVAL_MS = Math.max(1500, Number(params.get('interval')) || 3000);
            const HISTORY_REFRESH_MS = Math.max(5000, Number(params.get('history_interval')) || 15000);

            const DOM = {
                status: document.getElementById('statusPill'),
                statusText: document.getElementById('statusText'),
                meta: document.getElementById('horizonMeta'),
                sheet: document.getElementById('horizonSheet'),
                empty: document.getElementById('horizonSheetEmpty'),
                refresh: document.getElementById('refreshBtn'),
                updatedAt: document.getElementById('updatedAt'),
                phaseChip: document.getElementById('phaseChip'),
                qtValue: document.getElementById('qtValue'),
                sqValue: document.getElementById('sqValue'),
                trendCanvas: document.getElementById('trendCanvas'),
                trendHint: document.getElementById('trendHint'),
                trendLabel: document.getElementById('trendLabel'),
            };

            const MAX_HISTORY = 240;
            const HORIZON_SYMBOLS_FALLBACK = " .:-=+*#%@";
            const HISTORY_LIMIT = Math.min(MAX_HISTORY, Math.max(8, Number(params.get('history_limit')) || 96));
            const state = {
                timer: null,
                lastPayload: null,
                history: [],
                lastSheetWeights: new Map(),
                lastUpdateTs: 0,
                tickerRaf: null,
                historyLabel: 'q_t / sQ trend',
                lastHistorySync: 0,
            };

            const clampRange = (v, min, max) => Math.max(min, Math.min(max, Number.isFinite(v) ? v : min));
            const num = (x, d = 0) => {
                const v = Number(x);
                return Number.isFinite(v) ? v : d;
            };

            function setTrendLabel(text) {
                if (typeof text === 'string' && text.trim()) {
                    state.historyLabel = text;
                    if (DOM.trendLabel) DOM.trendLabel.textContent = text;
                }
            }
            setTrendLabel(state.historyLabel);

            function normalizeHorizonPayload(raw) {
                if (!raw || typeof raw !== 'object') return null;
                const meta = raw.horizon_meta ?? raw.meta ?? null;
                const sheet = raw.horizon_sheet ?? raw.sheet ?? null;
                const payload = { ...raw, horizon_meta: meta, horizon_sheet: sheet };
                if (!payload.meta && meta) payload.meta = meta;
                if (!payload.sheet && sheet) payload.sheet = sheet;
                const mantle = meta?.mantle;
                if (mantle) {
                    const anomaly = num(mantle.anomaly_score, NaN);
                    const totalEnergy = num(mantle.total_energy, NaN);
                    if (!Number.isFinite(num(payload.q_t, NaN)) && Number.isFinite(anomaly)) {
                        payload.q_t = anomaly;
                    }
                    if (!Number.isFinite(num(payload.sq, NaN)) && Number.isFinite(totalEnergy)) {
                        payload.sq = totalEnergy;
                    }
                }
                return payload;
            }

            async function refreshHistoryFromServer(force = false) {
                if (!API.horizonHistory) return;
                const now = Date.now();
                if (!force && (now - state.lastHistorySync) < HISTORY_REFRESH_MS) {
                    return;
                }
                try {
                    const sep = API.horizonHistory.includes('?') ? '&' : '?';
                    const res = await fetch(`${API.horizonHistory}${sep}limit=${HISTORY_LIMIT}`, { cache: 'no-store' });
                    if (!res.ok) return;
                    const body = await res.json();
                    const items = Array.isArray(body?.history) ? body.history : [];
                    const mapped = [];
                    for (const entry of items) {
                        const normalized = normalizeHorizonPayload(entry);
                        if (!normalized) continue;
                        const q = num(normalized.q_t, NaN);
                        const sq = num(normalized.sq, NaN);
                        if (Number.isFinite(q) && Number.isFinite(sq)) {
                            mapped.push({ q, sq });
                            if (mapped.length >= MAX_HISTORY) break;
                        }
                    }
                    if (mapped.length) {
                        state.history = mapped.slice(-MAX_HISTORY);
                        const label = items.some(item => (item?.meta ?? item?.horizon_meta)?.mantle)
                            ? 'Mantle anomaly / energy trend'
                            : 'q_t / sQ trend';
                        setTrendLabel(label);
                        if (DOM.trendHint) {
                            const count = state.history.length;
                            DOM.trendHint.textContent = `${count} sample${count === 1 ? '' : 's'}`;
                        }
                        renderTrend();
                        state.lastHistorySync = now;
                    }
                } catch (err) {
                    console.warn('Failed to refresh horizon history:', err);
                }
            }

            function formatTimeAgo(msAgo) {
                if (!Number.isFinite(msAgo) || msAgo <= 0) return 'just now';
                const s = msAgo / 1000;
                if (s < 5) return 'just now';
                if (s < 60) return `${Math.floor(s)}s ago`;
                const m = s / 60;
                if (m < 60) return `${Math.floor(m)}m ago`;
                const h = m / 60;
                return `${Math.floor(h)}h ago`;
            }

            function startUpdateTicker() {
                if (state.tickerRaf) cancelAnimationFrame(state.tickerRaf);
                const tick = () => {
                    if (DOM.updatedAt) {
                        if (!state.lastUpdateTs) {
                            DOM.updatedAt.textContent = 'Waiting for first update…';
                        } else {
                            DOM.updatedAt.textContent = `Updated ${formatTimeAgo(Date.now() - state.lastUpdateTs)}`;
                        }
                    }
                    state.tickerRaf = requestAnimationFrame(tick);
                };
                tick();
            }

            function setStatus(message, tone = 'pending') {
                if (!DOM.status) return;
                DOM.status.classList.remove('ok', 'warn');
                if (tone === 'ok') DOM.status.classList.add('ok');
                if (tone === 'warn') DOM.status.classList.add('warn');
                if (DOM.statusText) DOM.statusText.textContent = message;
                else DOM.status.textContent = message;
            }

            function formatBhNumber(value, digits = 2) {
                const v = num(value, NaN);
                return Number.isFinite(v) ? v.toFixed(digits) : '--';
            }

            function renderHorizonMeta(meta, panel) {
                const wrap = DOM.meta;
                if (!wrap) return;
                wrap.textContent = '';

                const resolvedMeta = meta ?? panel?.horizon_meta ?? panel?.meta ?? null;
                const mantle = resolvedMeta?.mantle;
                const efd = resolvedMeta?.efd;

                const entries = [];
                const phaseLabel = panel?.phase ?? (mantle?.region_type ? `${mantle.region_type}` : 'dormant');
                entries.push({ label: 'Phase', value: `${phaseLabel} → q=${formatBhNumber(panel?.q_t, 2)}` });
                entries.push({ label: 'Scale', value: `sq=${formatBhNumber(panel?.sq, 2)}` });
                if (resolvedMeta?.route) entries.push({ label: 'Route', value: String(resolvedMeta.route) });
                if (resolvedMeta?.cluster_size !== undefined) entries.push({ label: 'Cluster', value: String(resolvedMeta.cluster_size) });
                if (resolvedMeta?.center_id) entries.push({ label: 'Center', value: String(resolvedMeta.center_id) });
                if (resolvedMeta && resolvedMeta.pre_mse !== undefined && resolvedMeta.post_mse !== undefined) {
                    entries.push({
                        label: 'MSE',
                        value: `${formatBhNumber(resolvedMeta.pre_mse, 3)} → ${formatBhNumber(resolvedMeta.post_mse, 3)}`
                    });
                }
                if (mantle) {
                    entries.push({
                        label: 'Mantle',
                        value: `${String(mantle.region_type || 'field')} · anomaly=${formatBhNumber(mantle.anomaly_score, 3)}`
                    });
                    const mantleParts = [];
                    if (mantle.total_energy !== undefined) mantleParts.push(`energy=${formatBhNumber(mantle.total_energy, 3)}`);
                    if (mantle.total_flux !== undefined) mantleParts.push(`flux=${formatBhNumber(mantle.total_flux, 3)}`);
                    if (mantle.E_norm !== undefined) mantleParts.push(`|E|=${formatBhNumber(mantle.E_norm, 3)}`);
                    if (mantle.B_norm !== undefined) mantleParts.push(`|B|=${formatBhNumber(mantle.B_norm, 3)}`);
                    if (mantle.num_sites !== undefined) mantleParts.push(`#sites=${formatBhNumber(mantle.num_sites, 0)}`);
                    entries.push({
                        label: 'Field',
                        value: mantleParts.length ? mantleParts.join(' · ') : 'n/a'
                    });
                }
                if (efd) {
                    if (efd.last_candidate) {
                        entries.push({
                            label: 'EFD',
                            value: `${efd.last_candidate.name || 'candidate'} · score=${formatBhNumber(efd.last_candidate.score, 3)}`
                        });
                    } else {
                        entries.push({
                            label: 'EFD',
                            value: `${efd.active_candidates || 0} candidates · history ${efd.history ?? 0}`
                        });
                    }
                }

                if (!entries.length) {
                    entries.push({ label: 'Status', value: 'Awaiting boundary glyph…' });
                }

                const frag = document.createDocumentFragment();
                entries.forEach(entry => {
                    const item = document.createElement('div');
                    item.className = 'horizon-meta-item';
                    const labelEl = document.createElement('span');
                    labelEl.className = 'label';
                    labelEl.textContent = entry.label;
                    const valueEl = document.createElement('span');
                    valueEl.className = 'value';
                    valueEl.textContent = entry.value;
                    item.appendChild(labelEl);
                    item.appendChild(valueEl);
                    frag.appendChild(item);
                });
                wrap.appendChild(frag);
            }

            function computeHorizonIntensity(weight, maxWeight) {
                const w = clampRange(num(weight, 0), 0, 1);
                const max = clampRange(num(maxWeight, 0.01), 0.01, 1);
                return clampRange(w / max, 0, 1);
            }

            function styleHorizonCell(span, intensity) {
                const hue = 210 - intensity * 140;
                const sat = 70 + intensity * 15;
                const light = 16 + intensity * 58;
                span.style.background = `hsl(${hue.toFixed(0)}, ${sat.toFixed(0)}%, ${light.toFixed(0)}%)`;
                span.style.color = intensity > 0.55 ? '#030712' : '#f9fafb';
                if (intensity > 0.7) span.classList.add('horizon-cell-hot');
            }

            function updatePhaseReadouts(panel) {
                if (DOM.phaseChip) {
                    const phase = panel?.phase ?? 'dormant';
                    DOM.phaseChip.textContent = String(phase).toUpperCase();
                }
                if (DOM.qtValue) {
                    DOM.qtValue.textContent = formatBhNumber(panel?.q_t, 3);
                }
                if (DOM.sqValue) {
                    DOM.sqValue.textContent = formatBhNumber(panel?.sq, 3);
                }
            }

            function recordHistory(panel) {
                if (!panel) return;
                const q = num(panel.q_t, NaN);
                const sq = num(panel.sq, NaN);
                if (!Number.isFinite(q) || !Number.isFinite(sq)) return;
                state.history.push({ q, sq });
                if (state.history.length > MAX_HISTORY) {
                    state.history = state.history.slice(-MAX_HISTORY);
                }
                if (DOM.trendHint) {
                    const count = state.history.length;
                    DOM.trendHint.textContent = `${count} sample${count === 1 ? '' : 's'}`;
                }
                renderTrend();
            }

            function renderTrend() {
                const canvas = DOM.trendCanvas;
                if (!canvas || !state.history.length) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                const w = rect.width;
                const h = rect.height;
                ctx.clearRect(0, 0, w, h);
                const qValues = state.history.map(p => p.q);
                const sqValues = state.history.map(p => p.sq);
                const qMin = Math.min(...qValues, 0);
                const qMax = Math.max(...qValues, 1);
                const sqMin = Math.min(...sqValues, 0);
                const sqMax = Math.max(...sqValues, 1);
                const normalize = (val, min, max) => {
                    if (max === min) return 0.5;
                    return clampRange((val - min) / (max - min), 0, 1);
                };
                const step = w / Math.max(state.history.length - 1, 1);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#7cb7ff';
                ctx.beginPath();
                state.history.forEach((point, i) => {
                    const x = i * step;
                    const y = h - normalize(point.q, qMin, qMax) * h;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
                ctx.strokeStyle = '#a087ff';
                ctx.beginPath();
                state.history.forEach((point, i) => {
                    const x = i * step;
                    const y = h - normalize(point.sq, sqMin, sqMax) * h;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            }

            function renderHorizonSheet(sheet) {
                const grid = DOM.sheet;
                const emptyEl = DOM.empty;
                if (!grid) return;
                if (!Array.isArray(sheet) || !sheet.length || !Array.isArray(sheet[0])) {
                    if (emptyEl) emptyEl.style.display = 'block';
                    grid.style.display = 'none';
                    return;
                }
                if (emptyEl) emptyEl.style.display = 'none';
                grid.style.display = 'grid';
                grid.textContent = '';
                const rows = sheet;
                const cols = rows[0]?.length || 0;
                grid.style.setProperty('--horizon-cols', String(cols));
                let maxWeight = 0;
                rows.forEach(row => {
                    row.forEach(cell => {
                        const w = num(cell?.weight, 0);
                        if (w > maxWeight) maxWeight = w;
                    });
                });
                const frag = document.createDocumentFragment();
                const previousWeights = state.lastSheetWeights;
                const nextWeights = new Map();
                let weightSum = 0;
                let weightCount = 0;
                rows.forEach(row => {
                    row.forEach(cell => {
                        const idx = typeof cell?.idx === 'number' ? cell.idx : -1;
                        const sym = typeof cell?.symbol === 'string' ? cell.symbol : '';
                        const weight = Math.max(0, num(cell?.weight, 0));
                        const span = document.createElement('span');
                        span.className = 'horizon-cell';
                        if (idx < 0) {
                            span.classList.add('horizon-cell-empty');
                            span.textContent = '\u00A0';
                        } else {
                            const intensity = computeHorizonIntensity(weight, maxWeight);
                            styleHorizonCell(span, intensity);
                            span.dataset.idx = String(idx);
                            const displaySymbol = sym && sym.trim() !== '' ? sym : HORIZON_SYMBOLS_FALLBACK[idx % HORIZON_SYMBOLS_FALLBACK.length];
                            span.textContent = displaySymbol;
                            const symbolId = typeof cell?.symbol_id === 'string' ? cell.symbol_id : '';
                            const family = typeof cell?.family === 'string' ? cell.family : '';
                            const valence = typeof cell?.valence === 'string' ? cell.valence : '';
                            const tags = Array.isArray(cell?.tags) ? cell.tags.filter(Boolean) : [];
                            if (symbolId) span.dataset.symbolId = symbolId;
                            if (cell?.band) span.dataset.band = cell.band;
                            const tooltipParts = [
                                `Atom ${idx}`,
                                `weight ${formatBhNumber(weight, 3)}`,
                            ];
                            if (symbolId) tooltipParts.push(`#${symbolId}`);
                            if (family || valence) tooltipParts.push([family, valence].filter(Boolean).join(' · '));
                            if (tags.length) tooltipParts.push(tags.join(', '));
                            if (cell?.band) tooltipParts.push(`band:${cell.band}`);
                            if (typeof cell?.notes === 'string' && cell.notes.trim()) tooltipParts.push(cell.notes.trim());
                            span.title = tooltipParts.join('\n');
                            nextWeights.set(idx, weight);
                            weightSum += weight;
                            weightCount++;
                            const prev = previousWeights.get(idx);
                            if (prev !== undefined && Math.abs(prev - weight) >= 0.02) {
                                span.classList.add('glyph-pulse');
                                setTimeout(() => span.classList.remove('glyph-pulse'), 600);
                            }
                        }
                        frag.appendChild(span);
                    });
                });

                grid.appendChild(frag);
                state.lastSheetWeights = nextWeights;
                if (weightCount > 0) {
                    const avg = weightSum / weightCount;
                    const hue = 200 - avg * 120;
                    document.documentElement.style.setProperty('--grid-glow', `hsla(${hue.toFixed(0)}, 80%, 65%, 0.18)`);
                }
            }

            function updateBhPanelUI(payload, tone = 'pending') {
                state.lastPayload = payload;
                renderHorizonMeta(payload?.horizon_meta ?? payload?.meta ?? null, payload);
                renderHorizonSheet(payload?.horizon_sheet ?? payload?.sheet ?? null);
                updatePhaseReadouts(payload);
                recordHistory(payload);
                state.lastUpdateTs = Date.now();
                const histLen = payload?.history_length ?? state.history.length;
                setStatus(payload ? `Step ${payload.step ?? '-'} · history ${histLen}` : 'Awaiting data.', tone);
            }

            function buildMockBhPanel() {
                const rows = 12;
                const cols = 20;
                const sheet = [];
                for (let r = 0; r < rows; r++) {
                    const row = [];
                    for (let c = 0; c < cols; c++) {
                        const idx = r * cols + c;
                        const base = Math.abs(Math.sin((r + 1) * (c + 2)));
                        const weight = (base * base) / (rows * cols);
                        const sym = HORIZON_SYMBOLS_FALLBACK[idx % HORIZON_SYMBOLS_FALLBACK.length] || '.';
                        row.push({ idx, symbol: sym, weight });
                    }
                    sheet.push(row);
                }
                return {
                    phase: 'mock',
                    q_t: 0.42,
                    sq: 0.38,
                    step: 0,
                    horizon_sheet: sheet,
                    horizon_meta: {
                        center_id: 'mock:center:001',
                        cluster_size: 12,
                        route: 'BOUNDARY',
                        pre_mse: 0.041,
                        post_mse: 0.012,
                    },
                };
            }

            async function fetchHorizonLatest() {
                if (MOCK_ENABLED) {
                    updateBhPanelUI(buildMockBhPanel(), 'ok');
                    return true;
                }
                const endpoints = [API.horizonLatest, API.bhPanel].filter(Boolean);
                let lastError = null;
                for (const url of endpoints) {
                    try {
                        const res = await fetch(url, { cache: 'no-store' });
                        if (!res.ok) {
                            lastError = new Error(`HTTP ${res.status}`);
                            continue;
                        }
                        const data = await res.json();
                        const normalized = normalizeHorizonPayload(data) ?? data;
                        updateBhPanelUI(normalized, 'ok');
                        if (url === API.horizonLatest) {
                            await refreshHistoryFromServer(state.history.length === 0);
                        }
                        return true;
                    } catch (err) {
                        lastError = err;
                        console.warn('Horizon fetch error:', err);
                    }
                }
                if (lastError) console.warn('Horizon fetch failed:', lastError);
                setStatus('Fetch failed - will retry', 'warn');
                return false;
            }

            function startWatcher() {
                stopWatcher();
                const tick = async () => {
                    await fetchHorizonLatest();
                    state.timer = setTimeout(tick, REFRESH_INTERVAL_MS);
                };
                tick();
            }

            function stopWatcher() {
                if (state.timer) {
                    clearTimeout(state.timer);
                    state.timer = null;
                }
            }

            DOM.refresh?.addEventListener('click', async () => {
                DOM.refresh.disabled = true;
                await fetchHorizonLatest();
                setTimeout(() => { DOM.refresh.disabled = false; }, 600);
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    stopWatcher();
                } else {
                    startWatcher();
                }
            });

            window.addEventListener('resize', () => renderTrend());
            startUpdateTicker();
            renderTrend();
            updateBhPanelUI(null);
            refreshHistoryFromServer(true);
            startWatcher();
        })();
    </script>
</body>
